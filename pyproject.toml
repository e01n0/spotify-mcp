[project]
name = "spotify-mcp"
version = "0.1.0"
description = "MCP server for Spotify — flat tools, PKCE auth, keyring-backed token storage."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "e01n0" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.3,<2",
    "pydantic>=2.7",
    "keyring>=25",
]

[project.scripts]
spotify-mcp = "spotify_mcp:main"

[project.urls]
Homepage = "https://github.com/e01n0/spotify-mcp"
Repository = "https://github.com/e01n0/spotify-mcp"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"
reportMissingImports = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
